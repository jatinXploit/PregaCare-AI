name: Sync backend to Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Hugging Face CLI with Xet
        run: |
          python -m pip install --upgrade "huggingface_hub[hf_xet]"

      - name: Upload project to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload jatinXploit/pregacare-api . . \
            --repo-type space \
            --token "$HF_TOKEN"